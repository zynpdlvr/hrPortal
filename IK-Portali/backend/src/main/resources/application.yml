
spring:
  application:
    name: ik-portali

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ik_portal}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
server:
  port: 8080
